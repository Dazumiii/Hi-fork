name: Build Skeleton Rig APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android wrapper project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/dazumiii/skeletonrig

          cp -a index.html *.js *.json android/app/src/main/assets/

          for folder in animations character; do
            if [ -d "$folder" ]; then
              cp -a "$folder" android/app/src/main/assets/
            fi
          done

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SkeletonRigAndroid'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dazumiii.skeletonrig'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dazumiii.skeletonrig'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Skeleton Rig"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/dazumiii/skeletonrig/MainActivity.java <<'EOF'
          package com.dazumiii.skeletonrig;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewAssetLoader.AssetsPathHandler;
          import androidx.webkit.WebViewClientCompat;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;

          public class MainActivity extends Activity {
              private static final int PICK_FILE = 901;
              private ValueCallback<Uri[]> pendingFiles;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  WebView web = new WebView(this);
                  setContentView(web);

                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(false);
                  web.getSettings().setAllowContentAccess(true);
                  web.getSettings().setBuiltInZoomControls(false);

                  final WebViewAssetLoader loader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                          WebView view,
                          WebResourceRequest request
                      ) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params
                      ) {
                          if (pendingFiles != null) {
                              pendingFiles.onReceiveValue(null);
                          }

                          pendingFiles = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(intent, PICK_FILE);
                              return true;
                          } catch (Exception e) {
                              pendingFiles = null;
                              return false;
                          }
                      }
                  });

                  web.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              protected void onActivityResult(
                  int req,
                  int result,
                  Intent data
              ) {
                  super.onActivityResult(req, result, data);

                  if (req == PICK_FILE && pendingFiles != null) {
                      pendingFiles.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(
                              result, data
                          )
                      );
                      pendingFiles = null;
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonRig-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
