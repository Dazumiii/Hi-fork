name: Build Skeleton Rig APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        shell: bash
        run: |
          set -e
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/skeletonrig/app
          mkdir -p android/app/src/main/assets

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'SkeletonRig'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.skeletonrig.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.skeletonrig.app'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:label="Skeleton Rig"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android/app/src/main/java/com/skeletonrig/app/MainActivity.java <<'EOF'
          package com.skeletonrig.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;

          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {

              private WebView webView;

              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_REQUEST = 100;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  WebViewAssetLoader loader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build();

                  webView.setWebViewClient(
                      new WebViewClientCompat() {

                          @Override
                          public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {
                              return loader.shouldInterceptRequest(
                                  request.getUrl()
                              );
                          }
                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params
                          ) {
                              if (fileCallback != null) {
                                  fileCallback.onReceiveValue(null);
                              }

                              fileCallback = callback;

                              try {
                                  Intent intent = params.createIntent();

                                  startActivityForResult(
                                      intent,
                                      FILE_REQUEST
                                  );

                                  return true;

                              } catch (Exception e) {
                                  fileCallback = null;
                                  return false;
                              }
                          }
                      }
                  );

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              protected void onActivityResult(
                  int request,
                  int result,
                  Intent data
              ) {
                  super.onActivityResult(request, result, data);

                  if (
                      request == FILE_REQUEST
                      && fileCallback != null
                  ) {
                      fileCallback.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(
                              result,
                              data
                          )
                      );

                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Copy Skeleton Rig files
        shell: bash
        run: |
          set -e

          echo "Copying Skeleton Rig files..."

          test -f index.html

          mkdir -p android/app/src/main/assets

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='node_modules' \
            --exclude='screenshots' \
            ./ android/app/src/main/assets/

          echo "Checking index.html..."

          test -f android/app/src/main/assets/index.html

          echo "Files copied successfully!"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle -p android --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonRig-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
